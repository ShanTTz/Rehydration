[project]
name = "bdmtf-oasis-social-revision"
version = "0.3.0"
description = "Empirically validated BDMTF revision with leakage-safe Reddit splits and optional OASIS adapters."
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyarrow>=12",
  "requests>=2.31",
]

[project.optional-dependencies]
oasis = ["camel-oasis"]
dev = ["pytest>=8"]

[project.scripts]
bdmtf = "bdmtf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
